<!DOCTYPE html>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      color: #1e293b;

      max-width: 480px;

    .icon {
      font-size: 3rem;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;

    p {
      font-size: 1rem;
      color: #64748b;
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    a {
      display: inline-block;
      background: #1e293b;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.7rem 1.5rem;
      border-radius: 10px;
      transition: background 0.2s;
    }

    a:hover { background: #2563eb; }
